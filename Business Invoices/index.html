<script>
let rowCount = 0;

function blockNonNumericKeys(e, allowDecimal){
  const allowedControlKeys = ['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Tab','Home','End'];
  if(allowedControlKeys.includes(e.key)) return;
  if(e.ctrlKey || e.metaKey) return;
  if(e.key >= '0' && e.key <= '9') return;
  if(allowDecimal && e.key === '.' && !e.target.value.includes('.')) return;
  e.preventDefault();
}

function sanitizeNumberInput(el, allowDecimal){
  let v = el.value;
  if(allowDecimal){
    v = v.replace(/[^0-9.]/g, '');
    const parts = v.split('.');
    if(parts.length > 2){
      v = parts[0] + '.' + parts.slice(1).join('');
    }
  } else {
    v = v.replace(/[^0-9]/g, '');
  }
  if(v !== el.value) el.value = v;
}

function addRow(){
  rowCount++;
  const tbody = document.getElementById('itemsBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="no-cell">${rowCount}</td>
    <td class="art"><input type="text" class="art-no" placeholder="Art No."></td>
    <td><input type="number" class="pcs" min="0" step="1" inputmode="numeric" oninput="sanitizeNumberInput(this,false);calcAll()" onkeydown="blockNonNumericKeys(event,false)"></td>
    <td><input type="number" class="price" min="0" step="0.01" inputmode="decimal" oninput="sanitizeNumberInput(this,true);calcAll()" onkeydown="blockNonNumericKeys(event,true)"></td>
    <td class="amt-cell"><span class="row-total">0.00</span></td>
    <td class="del-cell"><button class="del-btn" onclick="delRow(this)">✕</button></td>
  `;
  tbody.appendChild(tr);
}

function delRow(btn){
  const tbody = document.getElementById('itemsBody');
  if(tbody.rows.length <= 1) return;
  btn.closest('tr').remove();
  renumberRows();
  calcAll();
}

function renumberRows(){
  const rows = document.querySelectorAll('#itemsBody tr');
  rows.forEach((r,i)=>{ r.querySelector('.no-cell').textContent = i+1; });
  rowCount = rows.length;
}

function calcAll(){
  let total = 0;
  document.querySelectorAll('#itemsBody tr').forEach(row=>{
    const pcs = parseFloat(row.querySelector('.pcs').value) || 0;
    const price = parseFloat(row.querySelector('.price').value) || 0;
    const amt = pcs * price;
    row.querySelector('.row-total').textContent = amt.toFixed(2);
    total += amt;
  });
  const sgstRate = parseFloat(document.getElementById('sgstRate').value) || 0;
  const igstRate = parseFloat(document.getElementById('igstRate').value) || 0;
  const sgstAmt = total * sgstRate / 100;
  const igstAmt = total * igstRate / 100;
  const net = total + sgstAmt + igstAmt;
  document.getElementById('amountVal').textContent = total.toFixed(2);
  document.getElementById('sgstVal').textContent = sgstAmt.toFixed(2);
  document.getElementById('igstVal').textContent = igstAmt.toFixed(2);
  document.getElementById('netAmountVal').textContent = net.toFixed(2);
}

function newBill(){
  if(!confirm('Sab fields clear ho jayenge (naya blank bill banega). Continue?')) return;
  document.getElementById('billNo').value='';
  document.getElementById('billDate').value='';
  document.getElementById('custName').value='';
  document.getElementById('custAddr').value='';
  document.getElementById('custGst').value='';
  document.getElementById('itemsBody').innerHTML='';
  rowCount = 0;
  for(let i=0;i<6;i++) addRow();
  calcAll();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function formatDateDMY(isoDate){
  if(!isoDate) return '';
  const parts = isoDate.split('-');
  if(parts.length !== 3) return isoDate;
  const [y,m,d] = parts;
  return `${d}-${m}-${y}`;
}

function buildHeaderBlock(vals){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="jai">${escapeHtml(vals.jaiText)}</div>
    <div class="band">
      <div class="mob-left"><span>${escapeHtml(vals.mobLeft)}</span></div>
      <div class="company-center">
        <div class="cname">${escapeHtml(vals.companyName)}</div>
        <div class="ctag">${escapeHtml(vals.companyTag)}</div>
        <div class="caddr">${escapeHtml(vals.companyAddr)}</div>
      </div>
      <div class="mob-right"><span>${escapeHtml(vals.mobRight1)}</span><span>${escapeHtml(vals.mobRight2)}</span></div>
    </div>
    <div class="gst-band">
      <div class="gst-left"><label>GST NO :</label> <span>${escapeHtml(vals.companyGst)}</span></div>
      <div class="gst-right"><label>PAN NUMBER :</label> <span>${escapeHtml(vals.companyPan)}</span></div>
    </div>
    <div class="title-row">BILL</div>
    <div class="meta">
      <div class="meta-left">
        <div class="meta-row"><label>NAME :-</label><span class="fillval">${escapeHtml(vals.custName)}</span></div>

        <div class="meta-row"><label>GST NO :-</label><span class="fillval">${escapeHtml(vals.custGst)}</span></div>
      </div>

        <div class="meta-row"><label>DATE :-</label><span class="fillval">${escapeHtml(vals.billDate)}</span></div>

function buildTable(rowsChunk, startIndex){
  const table = document.createElement('table');
  table.innerHTML = `
    <thead><tr>
      <th style="width:34px;">NO.</th>
      <th>ART NO.</th>
      <th style="width:70px;">PCS.</th>
      <th style="width:90px;">PRICE</th>
      <th style="width:100px;">TOTAL</th>
    </tr></thead>
    <tbody></tbody>`;
  const tbody = table.querySelector('tbody');
  rowsChunk.forEach((r,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="no-cell">${startIndex+i+1}</td>
      <td class="art" style="text-align:left;">${escapeHtml(r.art)}</td>
      <td style="text-align:center;">${escapeHtml(r.pcs)}</td>
      <td style="text-align:center;">${escapeHtml(r.price)}</td>
      <td class="amt-cell" style="text-align:right;">${r.total}</td>`;
    tbody.appendChild(tr);
  });
  return table;
}

function buildFooterBlock(vals){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="foot">
      <div class="foot-left">
        <div class="bank-details">
          <div class="bank-grid">
            <div class="bank-field wide"><label>Bank</label><span>${escapeHtml(vals.bankName)}</span></div>
            <div class="bank-field wide"><label>Branch</label><span>${escapeHtml(vals.bankBranch)}</span></div>
            <div class="bank-field wide"><label>A/C Name</label><span>${escapeHtml(vals.bankAcName)}</span></div>
            <div class="bank-field"><label>A/C No</label><span>${escapeHtml(vals.bankAcNo)}</span></div>
            <div class="bank-field"><label>IFSC</label><span>${escapeHtml(vals.bankIfsc)}</span></div>
          </div>
        </div>
        <div class="terms">
          <h4>-: TERMS &amp; CONDITIONS :-</h4>
          <div class="terms-text">${escapeHtml(vals.termsText)}</div>
        </div>
      </div>
      <div class="amt-box">
        <div class="amt-row"><span>AMOUNT</span><span class="val">${vals.amountTotal.toFixed(2)}</span></div>
        <div class="amt-row"><span>S.GST <span class="rate-wrap">(${vals.sgstRate}%)</span></span><span class="val">${vals.sgstAmt.toFixed(2)}</span></div>
        <div class="amt-row"><span>I.GST <span class="rate-wrap">(${vals.igstRate}%)</span></span><span class="val">${vals.igstAmt.toFixed(2)}</span></div>
        <div class="net-row"><span>NET AMOUNT :</span><span>${vals.netAmount.toFixed(2)}</span></div>
      </div>
    </div>`;
  return div;

function buildPrintPages(){
  const printRoot = document.getElementById('printRoot');
  printRoot.innerHTML = '';

  const vals = {
    jaiText: document.getElementById('jai').value,
    companyName: document.getElementById('companyName').value,
    companyTag: document.getElementById('companyTag').value,
    companyAddr: document.getElementById('companyAddr').value,
    companyGst: document.getElementById('companyGst').value,
    companyPan: document.getElementById('companyPan').value,
    mobLeft: document.getElementById('mobLeft').value,
    mobRight1: document.getElementById('mobRight1').value,
    mobRight2: document.getElementById('mobRight2').value,
    custName: document.getElementById('custName').value,
    custAddr: document.getElementById('custAddr').value,
    custGst: document.getElementById('custGst').value,
    billNo: document.getElementById('billNo').value,
    billDate: formatDateDMY(document.getElementById('billDate').value),
    termsText: document.getElementById('terms').value,
    bankName: document.getElementById('bankName').value,
    bankBranch: document.getElementById('bankBranch').value,
    bankAcName: document.getElementById('bankAcName').value,
    bankAcNo: document.getElementById('bankAcNo').value,
    bankIfsc: document.getElementById('bankIfsc').value,
    sgstRate: parseFloat(document.getElementById('sgstRate').value) || 0,
    igstRate: parseFloat(document.getElementById('igstRate').value) || 0
  };

  const rowsData = [];
  document.querySelectorAll('#itemsBody tr').forEach(row=>{
    const art = row.querySelector('.art-no').value;
    const pcs = row.querySelector('.pcs').value;
    const price = row.querySelector('.price').value;
    if(art.trim() || pcs || price){
      const pcsNum = parseFloat(pcs) || 0;
      const priceNum = parseFloat(price) || 0;
      rowsData.push({art, pcs, price, total:(pcsNum*priceNum).toFixed(2)});
    }
  });
  if(rowsData.length === 0){
    rowsData.push({art:'', pcs:'', price:'', total:'0.00'});
  }
  vals.amountTotal = rowsData.reduce((s,r)=> s + parseFloat(r.total), 0);
  vals.sgstAmt = vals.amountTotal * vals.sgstRate / 100;
  vals.igstAmt = vals.amountTotal * vals.igstRate / 100;
  vals.netAmount = vals.amountTotal + vals.sgstAmt + vals.igstAmt;

  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:820px;visibility:hidden;';
  document.body.appendChild(probe);

  const headerBlock = buildHeaderBlock(vals);
  probe.appendChild(headerBlock);
  const headerH = headerBlock.getBoundingClientRect().height;
  probe.removeChild(headerBlock);

  const sampleTable = buildTable([rowsData[0]], 0);
  probe.appendChild(sampleTable);
  const theadH = sampleTable.querySelector('thead').getBoundingClientRect().height;
  const rowH = sampleTable.querySelector('tbody tr').getBoundingClientRect().height;
  probe.removeChild(sampleTable);

  const footerBlock = buildFooterBlock(vals);
  probe.appendChild(footerBlock);
  const footH = footerBlock.getBoundingClientRect().height;
  probe.removeChild(footerBlock);

  document.body.removeChild(probe);

  const pagePx = 277 * 96 / 25.4;
  const safety = 8;

  const rowsPage1Max = Math.max(1, Math.floor((pagePx - headerH - theadH - safety) / rowH));
  const rowsOtherMax = Math.max(1, Math.floor((pagePx - theadH - safety) / rowH));

  const pages = [];
  let idx = 0, first = true;
  while(idx < rowsData.length){
    const maxForThis = first ? rowsPage1Max : rowsOtherMax;
    const chunk = rowsData.slice(idx, idx + maxForThis);
    pages.push({rows:chunk, startIndex:idx, isFirst:first});
    idx += chunk.length;
    first = false;
  }
  if(pages.length === 0){
    pages.push({rows:[], startIndex:0, isFirst:true});
  }

  const lastPage = pages[pages.length-1];
  const lastUsed = (lastPage.isFirst ? headerH : 0) + theadH + lastPage.rows.length*rowH;
  const footerFitsOnLastPage = (lastUsed + footH + safety) <= pagePx;
  const totalPages = pages.length + (footerFitsOnLastPage ? 0 : 1);

  pages.forEach((p, pageIdx)=>{
    const pageDiv = document.createElement('div');
    pageDiv.className = 'print-page';
    if(p.isFirst){
      pageDiv.appendChild(buildHeaderBlock(vals));
    }
    const contentFlex = document.createElement('div');
    contentFlex.className = 'content-flex';
    contentFlex.appendChild(buildTable(p.rows, p.startIndex));
    pageDiv.appendChild(contentFlex);

    const isLastDataPage = (pageIdx === pages.length-1);
    if(isLastDataPage && footerFitsOnLastPage){
      pageDiv.appendChild(buildFooterBlock(vals));
    }
    const pageNum = document.createElement('div');
    pageNum.className = 'page-num';
    pageNum.textContent = `Page ${pageIdx+1} of ${totalPages}`;
    pageDiv.appendChild(pageNum);

    printRoot.appendChild(pageDiv);
  });

  if(!footerFitsOnLastPage){
    const pageDiv = document.createElement('div');
    pageDiv.className = 'print-page';
    const spacer = document.createElement('div');
    spacer.className = 'content-flex';
    pageDiv.appendChild(spacer);
    pageDiv.appendChild(buildFooterBlock(vals));
    const pageNum = document.createElement('div');
    pageNum.className = 'page-num';
    pageNum.textContent = `Page ${totalPages} of ${totalPages}`;
    pageDiv.appendChild(pageNum);
    printRoot.appendChild(pageDiv);
  }
}

function printBill(){
  buildPrintPages();
  window.print();
}

window.addEventListener('beforeprint', buildPrintPages);
window.addEventListener('afterprint', function(){
  document.getElementById('printRoot').innerHTML = '';
});
